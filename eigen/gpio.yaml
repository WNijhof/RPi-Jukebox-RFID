# GPIO-configuratie voor onze muziekbox (Phoniebox v3)
# Kopieer naar ~/RPi-Jukebox-RFID/shared/settings/gpio.yaml op de Pi
# en zet in shared/settings/jukebox.yaml:  gpioz: enable: true
#
# Pinnummers zijn BCM/GPIO-nummers (niet de fysieke pin!). Zie het pinplan in de bouwdocumentatie.
# NIET gebruiken: GPIO 18, 19, 20, 21 (I2S-versterker), 8, 9, 10, 11, 24, 25 (RC522)
# en 2, 3 (I2C: de PiSugar-accu leest daarover het batterijniveau uit).
# Aan/uit gaat via de knop van de PiSugar (zie bouwdocumentatie).
pin_factory:
  type: rpigpio.RPiGPIOFactory
output_devices:
  StatusLED:
    # Brandt zodra de box klaar is voor gebruik
    type: LED
    connect:
      - gpio.gpioz.plugin.connectivity.register_status_led_callback
    kwargs:
      pin: 17
  # RfidBuzzer:
  #   # Optioneel: piept bij kaart, opstarten, afsluiten en min/max volume
  #   type: Buzzer
  #   connect:
  #     - gpio.gpioz.plugin.connectivity.register_rfid_callback
  #     - gpio.gpioz.plugin.connectivity.register_status_buzzer_callback
  #     - gpio.gpioz.plugin.connectivity.register_volume_buzzer_callback
  #   kwargs:
  #     pin: 27
input_devices:
  # Zonder PiSugar-accu (op netstroom) kun je een aan/uit-knop op GPIO 3 gebruiken:
  # 3 seconden vasthouden = netjes afsluiten, kort drukken als de Pi uit staat = aanzetten.
  # AanUit:
  #   type: LongPressButton
  #   kwargs:
  #     pin: 3
  #     hold_time: 3
  #   actions:
  #     on_press:
  #       alias: shutdown
  PlayPauze:
    type: Button
    kwargs:
      pin: 13
    actions:
      on_press:
        alias: toggle
  Vorige:
    # Kort = vorig nummer, lang (1 s) = playlist opnieuw vanaf het begin
    type: ShortLongPressButton
    kwargs:
      pin: 16
      hold_time: 1
    actions:
      on_short_press:
        alias: prev_song
      on_long_press:
        alias: replay
  Volgende:
    type: Button
    kwargs:
      pin: 26
    actions:
      on_press:
        alias: next_song
  VolumeOmlaag:
    # Vasthouden = blijft zachter gaan
    type: Button
    kwargs:
      pin: 22
      hold_time: 0.5
      hold_repeat: true
    actions:
      on_press:
        alias: change_volume
        args: -5
  VolumeOmhoog:
    type: Button
    kwargs:
      pin: 23
      hold_time: 0.5
      hold_repeat: true
    actions:
      on_press:
        alias: change_volume
        args: 5
  # Alternatief voor de twee volumeknoppen: een draaiknop (KY-040).
  # Draairichting verkeerd? Wissel a en b om.
  # VolumeDraaiknop:
  #   type: RotaryEncoder
  #   kwargs:
  #     a: 5
  #     b: 6
  #   actions:
  #     on_rotate_clockwise:
  #       alias: change_volume
  #       args: 5
  #     on_rotate_counter_clockwise:
  #       alias: change_volume
  #       args: -5
  # DraaiknopIndrukken:
